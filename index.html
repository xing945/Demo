<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="author" content="m.dongpi.com">
    <!--描述-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <!--缩屏-->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <title>如果命中注定我们在一起，那就抓住我的手别放弃</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: black;
            background-color: #000;
            overflow: hidden;
            perspective: 1000px;
            /*景深：视角*/
        }

        canvas{
            position: absolute;
            left:0;
            top:0;
            width:100%;
            height:100%;
        }

        .ds-no {
            display: none;
        }

        .ds-black {
            display: block;
        }

        #cube {
            width: 300px;
            height: 300px;
            margin: 150px auto;
            /*border:1px solid blue;*/
            position: relative;
            transform-style: preserve-3d;
            /*3D的环境*/
            /*transition:2s;动画过渡*/
            /*transform-origin:50% 50% -25px;旋转中心*/
            transform: translateX(50px) translateY(108px) translateZ(50px);
        }

        #cube div {
            /*混合选择器*/
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
            position: absolute;
        }

        #cube div:nth-child(1) {
            top: 100px;
            /*旋转中心：x方向 y方向 z方向*/
            /*transform-origin:50% 50% 0;*/
            transform-origin: top;
            /*css3属性：围绕X轴顺时针旋转90度*/
            transform: rotateX(-90deg)
        }

        #cube div:nth-child(2) {
            top: 0px;
            transform-origin: top;
            transform: rotateX(-90deg)
        }

        #cube div:nth-child(3) {
            left: -100px;
            transform-origin: right;
            transform: rotateY(-90deg)
        }

        #cube div:nth-child(4) {
            right: 100px;
            transform-origin: left;
            transform: rotateY(90deg)
        }

        #cube div:nth-child(5) {}

        #cube div:nth-child(6) {
            /*css3变换：沿着z轴做移动*/
            transform: translateZ(-100px);
        }

        /*#cube:hover{css动态伪类
         transform:rotateY(360deg);
    }*/


        #heart3D {
            width: 200px;
            height: 320px;
            margin: auto;
            transform-style: preserve-3d;
            /*设置为3D环境*/
            /*css3自定义动画：动画的名称 时间 匀速运动  无限重复*/
            animation: rot 10s linear infinite;
            position: relative;
        }

        /*css3动画关键帧*/
        @keyframes rot {
            from {
                transform: rotateX(0deg) rotateY(0deg);
            }

            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        #heart3D div.heart {
            width: 200px;
            height: 320px;
            border: 1px solid red;
            border-left: 0;
            /*0|none 推荐用0，因为低版本的ie不兼容none*/
            border-bottom: 0;
            border-radius: 50% 50% 0/50% 40% 0;
            /*圆角属性*/
            /*transform:rotate(45deg);*/
            position: absolute;
            left: 0;
            top: 0;
        }

        #cube div img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <canvas id="canvas" ></canvas>
    <div id="heart3D">
        <div id="cube">
            <!--顺序：上、下、左、右、前、后-->
            <div><img
                    src='./1.jpg' />
            </div>
            <div><img
                    src='./1.jpg '/>
            </div>
            <div><img
                    src='./1.jpg'/>
            </div>
            <div><img
                    src='./1.jpg' />
            </div>
            <div><img
                    src='./1.jpg' />
            </div>
            <div><img
                    src='./1.jpg' />
            </div>
        </div>
        <script type="text/javascript">
            var oHeart3D = document.getElementById("heart3D");
            for (var i = 0; i < 36; i++) {
                var oDiv = document.createElement("div");
                oDiv.className = "heart";
                oDiv.style.transform = "rotateY(" + i * 10 + "deg) rotateZ(45deg) translateX(60px)";
                //把创建出来的div添加到oHeart3D中
                oHeart3D.appendChild(oDiv);
            }
        </script>
    </div>
    <audio id="bgMusic" src="./courage.mp3"
        autoplay="autoplay" loop></audio>
    <script>
        var html = document.getElementsByTagName('html')[0]
        var bgMusic = document.getElementById('bgMusic')
        html.addEventListener('touchstart', function () {
            bgMusic.play()
        })
        function toggleSound() {
            if (bgMusic.paused) {
                //判读是否播放
                bgMusic.paused = false
                bgMusic.play() //没有就播放
            }
        }
        setInterval('toggleSound()', 1)

    </script>
    <script type="text/javascript">
		var Canvas = {}
		Canvas.anim = {
			init: function () {
				var canvas = document.getElementById('canvas')
				canvas.width = window.innerWidth
				canvas.height = window.innerHeight
				//设置画布
				this.ctx = canvas.getContext('2d')
				this.letters = '*******************'
				this.cw = canvas.width //获取画布宽
				this.ch = canvas.height //获取画布高
				this.particles = []
			},
			//执行动画
			render: function () {
				this.ctx.clearRect(0, 0, this.cw, this.ch)
				//字母的属性
				//设置x轴中心点
				var particle = {
					x: this.cw / 2,
					y: this.ch,
					xSpeed: Math.random() * 20 - 10,
					ySpeed: Math.random() * 20 - 10,
					size: 10,
					character: this.letters[
						Math.floor(Math.random() * this.letters.length)
					],
					/*color:[155, 100, 50, .7]*/
					color: function getRandomColor() {
						return (
							'#' +
							(function (color) {
								return (color += '0123456789abcdef'[
									Math.floor(Math.random() * 16)
								]) && color.length == 6
									? color
									: arguments.callee(color)
							})('')
						)
					},
				}
				this.particles.push(particle)
				this.drawParticle()
			},
			//绘制字母
			drawParticle: function () {
				var c = this.ctx
				var particleCount = this.particles.length
				for (var i = 0; i < particleCount; i++) {
					var particle = this.particles[i]
					//设置颜色hsla值
					var h = particle.color[0],
						s = particle.color[1] + '%',
						l = particle.color[2] + '%',
						a = particle.color[3]
					var hsla = 'hsla(' + h + ',' + s + ',' + l + ',' + a + ')'
					//设置颜色文字
					c.font = '12px sans-serif'
					c.fillStyle = particle.color()
					c.fillText(particle.character, particle.x, particle.y)
					//设置运动轨迹
					particle.x += particle.xSpeed
					particle.y += particle.ySpeed
					particle.y *= 0.98
					//document.body.style.backgroundColor = particle.color();
				}
				this.fadeParticle()
			},
			//背景透明
			fadeParticle: function () {
				this.ctx.fillStyle = particle.color()
				this.ctx.fillRect(0, 0, this.cw, this.ch)
			},
		}
		Canvas.anim.init()
		setInterval(function () {
			Canvas.anim.render()
		}, 20)
	</script>
</body>

</html>
